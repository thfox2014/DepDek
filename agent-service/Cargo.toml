[package]
name = "depdek-agent"
version = "0.2.1"
edition = "2021"
description = "Isolated DeepSeek Harness executor for DepDek"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "time", "sync", "signal"] }
url = "2"
libc = "0.2"
zeroize = "1.9"
agent-workbench = { path = "../src-tauri", default-features = false }

[dev-dependencies]
tempfile = "3"
