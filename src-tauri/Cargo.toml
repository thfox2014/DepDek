[package]
name = "agent-workbench"
version = "0.2.1"
description = "DepDek - local-first personal data workbench"
edition = "2021"

[lib]
name = "agent_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-workbench"
path = "src/main.rs"

# The `tauri-app` feature gates the desktop shell (tauri + plugins) so the
# vault/audit/rpc core can be built and tested on machines without the
# system webkit/glib dev libraries:
#   cargo test --no-default-features
[features]
default = ["tauri-app"]
tauri-app = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-store",
    "dep:tauri-build",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1.1"
tar = "0.4"
libc = "0.2"
errno = "0.3"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize", "password-hash"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.9"
getrandom = "0.4"
url = "2"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
time = "0.3"
sysinfo = "0.39.6"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-store = { version = "2", optional = true }

# P1: encrypted credential store (secrets/<scope>.enc.json, AES-256-GCM)
aes-gcm = "0.10"
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"
