set default=0
set timeout=5
set timeout_style=menu
set font=$prefix/unicode.pf2
if loadfont $font; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
else
    insmod all_video
fi
insmod gfxterm
insmod png
source /boot/grub/theme.cfg
set theme=/boot/grub/jiaho-theme.txt
export theme
terminal_output gfxterm
