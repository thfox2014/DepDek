source /boot/grub/config.cfg

@LINUX_LIVE@

menuentry 'Jiaho AI-OS recovery (text console)' {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ systemd.unit=multi-user.target plymouth.enable=0
    initrd @INITRD_LIVE@
}

if @ENABLE_INSTALL_MENU@; then
    source /boot/grub/install_start.cfg
    submenu 'Advanced install options ...' {
        source /boot/grub/install.cfg
    }
fi

submenu 'Utilities...' {
    if @ENABLE_MEMTEST@; then
        source /boot/grub/memtest.cfg
    fi
    if [ "${grub_platform}" = "efi" ]; then
        menuentry 'UEFI Firmware Settings' { fwsetup }
    fi
    if @ENABLE_VERIFY_CHECKSUMS@; then
        menuentry 'Verify integrity of the boot medium' {
            linux @KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
            initrd @INITRD_LIVE@
        }
    fi
}
