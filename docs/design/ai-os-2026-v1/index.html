  <main class="shell" id="shell" aria-label="家合 AI-OS 设计预览">
    <header class="topbar">
      <a href="#" class="brand" data-action="home" aria-label="家合首页"><img src="assets/jiaho-brand/logo.png" alt="家合 Jiaho"><span>家合</span></a>
      <div class="top-actions">
        <button class="preview-tag" data-action="about" title="独立设计预览，不连接真实模型或家庭资料">预览</button>
        <button class="icon-button tooltip" data-action="demo" aria-label="体验示例" data-tip="体验示例"><svg><use href="#play"/></svg></button>
        <div class="popover-anchor"><button class="icon-button tooltip" id="appearance-button" data-action="appearance" aria-expanded="false" aria-controls="appearance" aria-label="外观" data-tip="外观"><svg><use href="#palette"/></svg></button>
          <section class="appearance popover" id="appearance" aria-label="外观设置" hidden>
            <header><h2>外观</h2><button class="icon-button" data-action="close-appearance" aria-label="关闭外观设置"><svg><use href="#x"/></svg></button></header>
            <div class="theme-options" role="group" aria-label="明暗模式"><button data-theme-choice="light" aria-pressed="true"><svg><use href="#sun"/></svg>浅色</button><button data-theme-choice="dark" aria-pressed="false"><svg><use href="#moon"/></svg>深色</button></div>
            <div class="style-options" role="group" aria-label="界面材质"><button data-style-choice="glass" aria-pressed="true"><span class="style-swatch glass-swatch"></span>轻透<svg><use href="#check"/></svg></button><button data-style-choice="pure" aria-pressed="false"><span class="style-swatch pure-swatch"></span>纯净<svg><use href="#check"/></svg></button><button data-style-choice="focus" aria-pressed="false"><span class="style-swatch focus-swatch"></span>专注<svg><use href="#check"/></svg></button></div>
            <label class="size-option"><span>大字</span><input type="checkbox" id="large-type"><span class="switch-track" aria-hidden="true"></span></label>
            <div class="appearance-utilities"><button class="icon-button" data-action="workbench" aria-label="打开工作台" title="工作台"><svg><use href="#grid"/></svg></button><button class="icon-button" data-action="settings" aria-label="模型与设置" title="设置"><svg><use href="#settings"/></svg></button><button class="icon-button" data-action="lock" aria-label="锁定空间" title="锁定"><svg><use href="#lock"/></svg></button></div>
          </section>
        </div>
        <button class="icon-button tooltip panel-toggle" data-action="panel" aria-label="打开清单" aria-expanded="false" aria-controls="context-drawer" data-tip="清单"><svg><use href="#panel"/></svg><span class="unread-dot" hidden></span></button>
      </div>
    </header>

    <aside class="dock" aria-label="主导航">
      <nav class="dock-main" aria-label="伙伴与资料">
        <button class="dock-item is-selected tooltip" data-page="chat" aria-current="page" aria-label="悟空" data-tip="悟空"><span class="dock-icon"><img src="assets/jiaho-brand/wukong.svg" alt=""></span><span class="dock-label">悟空</span></button>
        <button class="dock-item tooltip" data-page="photos" aria-label="相册" data-tip="相册"><span class="dock-icon"><svg><use href="#photos"/></svg></span><span class="dock-label">相册</span></button>
        <button class="dock-item tooltip" data-page="videos" aria-label="视频" data-tip="视频"><span class="dock-icon"><svg><use href="#video"/></svg></span><span class="dock-label">视频</span></button>
        <button class="dock-item tooltip" data-page="documents" aria-label="资料" data-tip="资料"><span class="dock-icon"><svg><use href="#folder"/></svg></span><span class="dock-label">资料</span></button>
      </nav>
      <div class="dock-utilities"><button class="icon-button tooltip" data-action="workbench" aria-label="打开工作台" data-tip="工作台"><svg><use href="#grid"/></svg></button><button class="icon-button tooltip" data-action="settings" aria-label="模型与设置" data-tip="设置"><svg><use href="#settings"/></svg></button><button class="icon-button tooltip lock-button" data-action="lock" aria-label="锁定空间" data-tip="锁定"><svg><use href="#lock"/></svg></button></div>
    </aside>

    <section class="stage" id="stage" aria-label="悟空对话">
      <div class="stage-content">
        <section class="welcome" id="welcome"><div class="portrait"><span class="portrait-aura"></span><img src="assets/jiaho-brand/wukong.svg" alt="悟空头像"></div><h1 id="greeting">今天，想做点什么？</h1></section>
        <section class="messages" id="messages" aria-label="示例对话" aria-live="polite" hidden></section>
        <div class="input-area">
          <form id="chat-form" class="composer">
            <div class="attachment-chip" id="attachment-chip" hidden><svg><use href="#file"/></svg><span>维修资料.pdf <small>示例</small></span><button type="button" data-action="remove-attachment" aria-label="移除示例附件"><svg><use href="#x"/></svg></button></div>
            <label class="sr-only" for="draft">告诉悟空你想做什么</label><textarea id="draft" placeholder="把想做的事，交给悟空…" rows="2"></textarea>
            <div class="composer-toolbar"><div class="input-tools"><button class="icon-button tooltip" type="button" data-action="attach" aria-label="添加示例附件" data-tip="添加资料"><svg><use href="#plus"/></svg></button><button type="button" class="model-chip" data-action="model"><svg><use href="#chip"/></svg><span>本机</span><svg><use href="#down"/></svg></button></div><div class="input-actions"><button class="icon-button tooltip microphone" type="button" data-action="voice" aria-label="填入示例语音" data-tip="语音草稿"><svg><use href="#wave"/></svg></button><button class="send-button" id="send" type="submit" aria-label="发送" disabled><svg><use href="#up"/></svg></button></div></div>
          </form>
          <div class="quick-actions" id="quick-actions" aria-label="快速开始"></div>
        </div>
      </div>
    </section>

    <footer class="app-footer"><span>AI-OS <span class="app-version">v0.2.1</span></span><button class="privacy-button tooltip" data-action="privacy" aria-label="查看预览与隐私说明" data-tip="隐私说明"><svg><use href="#shield"/></svg></button></footer>

    <button class="drawer-scrim" id="drawer-scrim" data-action="close-panel" aria-label="关闭清单" hidden></button>
    <aside class="context-drawer" id="context-drawer" aria-label="清单面板" hidden>
      <header><div><span class="drawer-icon"><svg><use href="#check-circle"/></svg></span><h2>清单</h2></div><button class="icon-button" data-action="close-panel" aria-label="关闭清单"><svg><use href="#x"/></svg></button></header>
      <div id="drawer-content" class="drawer-content"></div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <dialog class="info-dialog" id="info-dialog"><header><h2 id="dialog-title"></h2><button class="icon-button" data-action="close-dialog" aria-label="关闭说明"><svg><use href="#x"/></svg></button></header><div id="dialog-body"></div></dialog>
