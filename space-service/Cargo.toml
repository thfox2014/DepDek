[package]
name = "depdek-space"
version = "0.2.0"
description = "DepDek logical storage space service"
edition = "2021"

[lib]
name = "depdek_space"
path = "src/lib.rs"

[[bin]]
name = "depdek-space"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
