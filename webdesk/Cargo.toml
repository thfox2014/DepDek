[package]
name = "depdek-webdesk"
version = "0.2.0"
edition = "2021"
description = "DepDek webdesk - remote web management console for the DepDek appliance"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["password-hash"] }
axum = "0.8.9"
getrandom = "0.4.3"
mime_guess = "2.0.5"
password-hash = "0.6.1"
rand = "0.10.3"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "std"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
